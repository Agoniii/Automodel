# Image-text SFT candidate: full vision tower + merger + Flash-Next backbone.
# QSA indexers remain frozen. Requires the vlm-media extra and a multi-node
# CUDA image with the same FlexAttention/FLA/EP dependencies as the text recipe.
# Hardware target: 8 nodes x 8 GPUs, EP64, TP=PP=CP=1, no sequence packing.
# Full-checkpoint distributed VLM convergence has not yet been validated.
# Launch through the existing multi-node launcher with this YAML as CONFIG.
# TE FusedAdam retains FP32 master weights/moments for BF16 parameter storage.

recipe: FinetuneRecipeForVLM

seed: 1234

step_scheduler:
  global_batch_size: 64
  local_batch_size: 1
  ckpt_every_steps: 100
  save_checkpoint_every_epoch: false
  val_every_steps: 100
  gc_every_steps: 10
  num_epochs: 1
  max_steps: 100

dist_env:
  backend: nccl
  timeout_minutes: 120

model:
  _target_: nemo_automodel.NeMoAutoModelForImageTextToText.from_config
  config:
    _target_: nemo_automodel.components.models.qwen3_8_flash_next.config.Qwen3_8_FlashNextConfig.from_pretrained
    pretrained_model_name_or_path: Qwen/Qwen3.8-Flash-Next
    name_or_path: Qwen/Qwen3.8-Flash-Next
    language_model_only: false
  trust_remote_code: false
  load_base_model: true
  torch_dtype: bfloat16
  use_liger_kernel: false
  use_sdpa_patching: false
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: flex
    linear: torch
    rms_norm: torch_fp32
    experts: torch_mm
    dispatcher: hybridep
    rope_fusion: false
    fake_balanced_gate: false
    gate_precision: float32
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true

checkpoint:
  enabled: true
  checkpoint_dir: checkpoints/qwen3_8_flash_next_180b_medpix_ep64
  model_save_format: safetensors
  save_consolidated: false

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 64
  sequence_parallel: false
  activation_checkpointing: true
  moe:
    reshard_after_forward: true
    wrap_outer_model: true

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

processor:
  _target_: transformers.Qwen3VLProcessor.from_pretrained
  pretrained_model_name_or_path: Qwen/Qwen3.8-Flash-Next
  padding_side: right

freeze_config:
  freeze_vision_tower: false
  freeze_language_model: false

# The processor emits patch rows, image/video grids, and unmodified raw token IDs.
# This example trains both the vision tower/merger and the language backbone.
dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.make_medpix_dataset
  path_or_dataset: mmoukouba/MedPix-VQA
  split: train

packed_sequence:
  packed_sequence_size: 0

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn:
    _target_: nemo_automodel.components.datasets.vlm.collate_fns.default_collate_fn
  num_workers: 0
  shuffle: true
  drop_last: true
validation_dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.make_medpix_dataset
  path_or_dataset: mmoukouba/MedPix-VQA
  split: validation
validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn:
    _target_: nemo_automodel.components.datasets.vlm.collate_fns.default_collate_fn
  num_workers: 0

optimizer:
  # BF16 torch AdamW quantizes the update directly into BF16 model storage;
  # at this model's 1e-5 LR most dense parameters would not change at all.
  # TE keeps an exact FP32 master as a BF16 value plus a 16-bit remainder and
  # uses FP32 moments while retaining BF16 model/checkpoint storage.
  _target_: transformer_engine.pytorch.optimizers.fused_adam.FusedAdam
  betas: [0.9, 0.95]
  eps: 1.0e-8
  lr: 1.0e-5
  weight_decay: 0.1
  adam_w_mode: true
  bias_correction: true
  master_weights: true
  master_weight_dtype: torch.float32
  store_param_remainders: true
  exp_avg_dtype: torch.float32
  exp_avg_sq_dtype: torch.float32
  param_group_overrides:
    - pattern: '\.ple\.ple_embedding\.ngram_embedding\.weight$'
      lr_mult: 5.0
      wd_mult: 0.0

# Param-group multipliers are applied by OptimizerParamScheduler.step(), so a
# scheduler is required even for a short run.  The table follows the same
# warmup/decay shape at exactly 5x the base-model LR.
lr_scheduler:
  lr_warmup_steps: 10
  lr_decay_steps: 100
  lr_decay_style: cosine
  min_lr: 1.0e-6

clip_grad_norm:
  max_norm: 1.0

wandb:
  enable: false
  project: qwen3-8-flash-next-180b-vlm
  name: qwen3_8_flash_next_180b_medpix_ep64
  dir: wandb
